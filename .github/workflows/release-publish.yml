name: リリースを公開する

# release/vX.Y.Z または hotfix/* の PR が main にマージされたら、タグを打ち、GitHub Release を作り、main を develop に戻す。
#
# 2つの経路から動く。
#   pull_request(closed)  人が PR をマージしたとき
#   workflow_call         release.yml が auto_merge で PR をマージしたとき
#
# GITHUB_TOKEN が行ったマージは pull_request(closed) のワークフローを起こさないため、後者は明示的に呼ぶ。
#
# hotfix/* は main から切り、その PR の中で package.json の版を上げておく（npm version patch --no-git-tag-version）。
# 版を上げずにマージすると、同じ版のタグがすでに別のコミットにあるため、ここで止まる。
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: 'リリースする版。v は付けない'
        required: true
        type: string

# release.yml から呼ばれるときは、呼び元が group: release を握っている。
# 同じ名前にすると互いに待ち合って進まなくなるため、別の名前にする
concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEVELOP_BRANCH: develop
  MAIN_BRANCH: main

jobs:
  publish:
    name: タグとGitHub Releaseを作る
    # 人が release/* か hotfix/* の PR をマージしたとき、または release.yml から呼ばれたときだけ動く。
    # 呼ばれたときの github コンテキストは呼び元（workflow_dispatch）のものになる
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.head.ref, 'release/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # 6つの対象をクロスビルドする分、タグと Release だけを作っていた頃より長くかかる
    timeout-minutes: 25
    permissions:
      contents: write        # タグを打ち、Release を作り、書庫を添付する
      pull-requests: write   # main を develop へ戻す PR を開く
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 要る道具があることを確かめる
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる。
        # zip は Windows 向けの書庫を作るのに使う。Linux の tar は zip を書けない
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）が無い。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi
          if ! command -v zip >/dev/null 2>&1; then
            echo "::error::zip が無い。Windows 向けの書庫を作れない。ランナーに入れてから実行する（例: apt-get install zip）"
            exit 1
          fi

      - name: mainを取得
        # zizmor: ignore[artipacked] このジョブはタグと develop を push するため、認証情報を残す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH }}
          # タグと develop を扱うため、履歴をすべて取る
          fetch-depth: 0

      - name: Nodeを用意
        # 版を package.json から読むのに使う。セルフホストのランナーに Node が無くても動く
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: 版を決める
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 実際の版は main の package.json から取る
          actual="$(node -p "require('./package.json').version")"

          # 期待する版は、呼び元の入力か、PR のブランチ名（release/vX.Y.Z）から取る。
          # hotfix/* はブランチ名に版を持たないため、package.json の版をそのまま使う
          case "${HEAD_REF}" in
            release/*) expected="${HEAD_REF#release/}"; expected="${expected#v}" ;;
            *) expected="${actual}" ;;
          esac
          if [ -n "${INPUT_VERSION}" ]; then
            expected="${INPUT_VERSION#v}"
          fi
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::${MAIN_BRANCH} の package.json の版（${actual}）とリリースの版（${expected}）が食い違う"
            exit 1
          fi

          prerelease=false
          case "${actual}" in
            *-*) prerelease=true ;;
          esac
          # 消すブランチ。PR から動いたときはその head、呼ばれたときは release/vX.Y.Z
          branch="${HEAD_REF:-release/v${actual}}"
          {
            echo "version=${actual}"
            echo "tag=v${actual}"
            echo "branch=${branch}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: マージの形を確かめる
        # マージコミット以外（squash、rebase）だと、develop で取り込んだ PR がリリースノートに載らない。
        # 止めはしないが、気付けるようにする
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ -n "${MERGE_SHA}" ] && ! git rev-parse --verify --quiet "${MERGE_SHA}^2" >/dev/null; then
            echo "::warning::PR がマージコミット以外でマージされた。リリースノートに PR が載らないことがある。次からは Create a merge commit を選ぶ"
          fi

      - name: Goを用意
        # 配布するバイナリを作るために要る。版は go.mod の go 行に従う
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # ここで作るものは配布物になる。他のブランチの実行が書き込めるキャッシュは持ち込まない。
          # 依存は標準ライブラリだけなので、キャッシュを切っても伸びるのは1分ほどで済む
          cache: false

      - name: バイナリと書庫を作る
        # タグを打つ前に作る。1つでもビルドに失敗したら、ここで止まってタグも Release も作らない。
        # 6種のうち5種だけが載った Release は、足りない対象の利用者から見れば壊れた配布になる
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # CGO を切ると、1台のランナーから6つの対象すべてを作れる（docs/research.md 5.4節）
          CGO_ENABLED: '0'
          # ジョブ全体の GH_TOKEN を、この段だけ空にする。ここはビルドした実行ファイルを
          # 実際に走らせる唯一の段で、gh は使わない。書き込み権限つきのトークンを
          # プロジェクト由来のコードから読める場所に置かない
          GH_TOKEN: ''
        run: |
          if [ -z "${VERSION}" ]; then
            echo "::error::版が空。書庫を作れない"
            exit 1
          fi

          # 対象は ci.yml の「全対象向けにビルドする」と同じ6種
          targets='linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64'

          # 入れ直しのときに前回の残りが混ざらないよう、毎回まっさらにする
          rm -rf dist
          mkdir -p dist

          # 書庫に入れる説明。詳しい手順は README.md にあるので、ここは要点と行き先だけにする
          cat > dist/README.txt <<TXT
          dwloc ${VERSION}

          Drag'n Wash の翻訳リポジトリを扱うコマンドです。
          この書庫には、実行ファイルと LICENSE とこの説明が入っています。

          使い方:
            dwloc validate --root <翻訳リポジトリのパス>
            dwloc diff     --root <翻訳リポジトリのパス>
            dwloc publish  --root <翻訳リポジトリのパス>
            dwloc version

          このバイナリには署名を付けていません。
          macOS では、初回に Gatekeeper が実行を止めることがあります。次の1行で隔離の印を外せます。
            xattr -d com.apple.quarantine ./dwloc
          Windows では、SmartScreen の警告が出ることがあります。
          「詳細情報」を押すと「実行」が出ます。
          dwloc.exe が見当たらないときは、Microsoft Defender による隔離を疑ってください。
          Windows セキュリティの「保護の履歴」で確認し、そこから許可します。
          macOS と Linux で Permission denied と出たときは、実行権限を付けます。
            chmod +x ./dwloc

          詳しい手順とチェックサムの確かめ方は、次のページにあります。
          https://github.com/223n/dragnwash-localization-editor
          TXT

          host_os="$(go env GOOS)"
          host_arch="$(go env GOARCH)"
          ran_one=false

          for target in ${targets}; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="dwloc_${VERSION}_${goos}_${goarch}"
            dir="dist/${name}"
            bin='dwloc'
            if [ "${goos}" = 'windows' ]; then
              bin='dwloc.exe'
            fi
            mkdir -p "${dir}"

            # -trimpath         作った人のパスをバイナリに残さない
            # -s -w             記号表とデバッグ情報を落とす。落とすと1つあたり3割ほど小さくなる
            # -X main.version   dwloc version が出す版。入れないと dev のままになり、
            #                   不具合報告でどの版か分からなくなる
            GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${dir}/${bin}" \
              ./cmd/dwloc

            cp LICENSE "${dir}/LICENSE"
            cp dist/README.txt "${dir}/README.txt"

            # tar.gz は権限をそのまま保つ。ランナーの umask に左右されないよう、ここで明示する。
            # これが落ちると、展開した翻訳者の手元で Permission denied になる
            if [ "${goos}" != 'windows' ]; then
              chmod 755 "${dir}/${bin}"
            fi

            # ランナーと同じ対象のものは、実際に動かして版が埋め込めたかを確かめる。
            # 6つとも同じ ldflags で作っているので、1つ動けば埋め込み自体は効いている。
            # -trimpath を付けると go version -m に ldflags が残らないため、
            # 他の5つを実行せずに確かめる手は無い（確認済み: go 1.27.1）
            if [ "${goos}" = "${host_os}" ] && [ "${goarch}" = "${host_arch}" ]; then
              got="$("${dir}/${bin}" version)"
              if [ "${got}" != "dwloc ${VERSION}" ]; then
                echo "::error::版が埋め込めていない。dwloc version が「${got}」と出た（期待: dwloc ${VERSION}）"
                exit 1
              fi
              echo "版を確かめた: ${got}（${goos}/${goarch}）"
              ran_one=true
            fi

            # Windows は zip、それ以外は tar.gz。展開の道具がその環境の標準で足りるようにする。
            # 書庫の中は name のディレクトリ1つにまとめ、展開先に中身が散らばらないようにする
            if [ "${goos}" = 'windows' ]; then
              (cd dist && zip -q -r -X "${name}.zip" "${name}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "${name}")
            fi
            rm -rf "${dir}"
            echo "できた: ${name}"
          done

          rm -f dist/README.txt

          if [ "${ran_one}" != 'true' ]; then
            echo "::warning::ランナーが ${host_os}/${host_arch} のため、作ったバイナリを動かして版を確かめられなかった"
          fi

          # 添付するのは6つの書庫と、この1ファイルだけ。
          # sha256sum -c と shasum -a 256 -c がそのまま読める形式にする
          (cd dist && sha256sum dwloc_*.tar.gz dwloc_*.zip > "dwloc_${VERSION}_checksums.txt")
          cat "dist/dwloc_${VERSION}_checksums.txt"

      - name: タグを打つ
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 同じタグを打ち直さない。片方の段だけが落ちて入れ直す場合に、ここで止まらないようにする。
          # ただし別のコミットを指しているなら、版を上げ忘れたまま同じ版を出そうとしている
          if git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::タグ ${TAG} はすでにこのコミットにある。打ち直さない"
              exit 0
            fi
            echo "::error::タグ ${TAG} はすでに別のコミットにある。package.json の版を上げてから ${MAIN_BRANCH} にマージする"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "${TAG}" --message "${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: 書庫を載せたGitHub Releaseを作る
        # 書庫は Release を作るのと同じ呼び出しで載せ、下書きのまま作ってから公開する。
        #
        # このリポジトリは「不変のリリース（immutable releases）」が有効である。
        # 公開した瞬間に添付が固定されるので、あとから gh release upload で足せない。
        # 実際、v0.4.0 は Release を作ってから書庫を載せる2段構えだったため、
        # 2段目が HTTP 422「Cannot upload assets to an immutable release」で落ちた。
        # タグと Release だけが公開され、書庫が1つも無い Release が残った。
        # 不変になるのは公開した時点なので、下書きのうちに載せてから公開する。
        #
        # 再実行の扱いも変える。前は「Release がすでにあれば作り直さず、添付だけ
        # 入れ直す」だった。不変のリリースではそれができないので、公開済みなら
        # 黙って続けず、理由を出して止める。下書きのまま残っていれば入れ直せる。
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          files=(
            dist/dwloc_"${VERSION}"_*.tar.gz
            dist/dwloc_"${VERSION}"_*.zip
            "dist/dwloc_${VERSION}_checksums.txt"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [ "${draft}" != 'true' ]; then
              echo "::error::Release ${TAG} はすでに公開されている。不変のリリースには後から書庫を足せない。版を上げてやり直す"
              exit 1
            fi
            # 下書きのまま残っている。前の実行が公開の手前で落ちた場合がこれにあたる。
            # --clobber は同じ名前の添付を入れ替える。書庫の中身が同じでも tar.gz と
            # zip に入る時刻は実行ごとに変わるので、6つとチェックサムは必ず一緒に入れ替える
            echo "::notice::Release ${TAG} は下書きのまま残っている。書庫を入れ直して公開する"
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            # 本文は PR のタイトルとラベルから自動で作る。分類は .github/release.yml で決める
            # 本文の頭に「どれを落とせばよいか」を置く。Release の画面にはファイル名しか
            # 並ばず、darwin が macOS のことだと分からない。README へ戻らないと選べない
            # 状態にしない。GitHub は --generate-notes の内容をこの後ろに足す
            args=(--draft --verify-tag --title "${TAG}" --generate-notes)
            header='.github/release-notes-header.md'
            if [ -f "${header}" ]; then
              args+=(--notes-file "${header}")
            else
              echo "::warning::${header} が無い。Release の本文に入手の案内が載らない"
            fi
            if [ "${PRERELEASE}" = 'true' ]; then
              args+=(--prerelease)
            fi
            gh release create "${TAG}" "${args[@]}" "${files[@]}"
          fi

          # 載せたものを数えてから公開する。途中で足りないまま公開すると、
          # 不変になったあとでは足せない
          got="$(gh release view "${TAG}" --json assets --jq '.assets | length')"
          want="${#files[@]}"
          if [ "${got}" -ne "${want}" ]; then
            echo "::error::添付が ${got} 件しかない（${want} 件を期待）。公開しない"
            exit 1
          fi

          gh release edit "${TAG}" --draft=false
          echo "- Release: $(gh release view "${TAG}" --json url --jq '.url')" >> "$GITHUB_STEP_SUMMARY"
          # ls をパイプすると shellcheck の SC2012 に当たり、actionlint を掛ける
          # CI（lint-workflows）が落ちる。for でファイル名を直に回す
          {
            echo '- 添付したもの:'
            for f in dist/*; do
              echo "  - $(basename "${f}")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: mainをdevelopへ戻す
        # 版の更新を develop にも届ける。まず直接押し、保護されていて押せなければ PR を開く。
        # 再実行しても壊れないよう、同じ PR がすでにあればそれを使う
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${DEVELOP_BRANCH}"
          git switch --create back-merge "origin/${DEVELOP_BRANCH}"

          if git merge-base --is-ancestor "origin/${MAIN_BRANCH}" HEAD; then
            echo "${DEVELOP_BRANCH} はすでに ${MAIN_BRANCH} を含んでいる"
            exit 0
          fi

          # 共通の祖先が無いと merge も PR も作れない。下の PR のフォールバックへ回しても、
          # head と base の履歴が繋がらないため gh pr create が拒まれる。ここで止める
          if ! git merge-base "origin/${MAIN_BRANCH}" HEAD >/dev/null 2>&1; then
            echo "::error::${MAIN_BRANCH} と ${DEVELOP_BRANCH} に共通の祖先が無い。タグと Release は作れたが、${DEVELOP_BRANCH} への戻しはできない。README の「履歴が繋がっていないとき」を見て直す"
            exit 1
          fi

          if git merge --no-ff --no-edit --message "${MAIN_BRANCH} を ${DEVELOP_BRANCH} に取り込む（${TAG}）" "origin/${MAIN_BRANCH}"; then
            if git push origin "HEAD:${DEVELOP_BRANCH}"; then
              echo "- ${DEVELOP_BRANCH}: ${MAIN_BRANCH} を直接取り込んだ" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::${DEVELOP_BRANCH} に直接押せなかった。PR で取り込む"
          else
            # abort に失敗しても、下の PR のフォールバックまで進めるようにする
            git merge --abort || true
            echo "::warning::${MAIN_BRANCH} と ${DEVELOP_BRANCH} が衝突する。PR で取り込む"
          fi

          # 直接押せなかったときは、main の内容をそのまま載せたブランチから PR を開く
          branch="merge/${TAG}-into-${DEVELOP_BRANCH}"
          url="$(gh pr list --base "${DEVELOP_BRANCH}" --head "${branch}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "${url}" ]; then
            echo "::notice::取り込みの PR はすでにある: ${url}"
          else
            git switch --create "${branch}" "origin/${MAIN_BRANCH}"
            git push --set-upstream origin "${branch}"
            url="$(gh pr create \
              --base "${DEVELOP_BRANCH}" \
              --head "${branch}" \
              --title "${MAIN_BRANCH} を ${DEVELOP_BRANCH} に取り込む（${TAG}）" \
              --body "リリース ${TAG} で上げた版を \`${DEVELOP_BRANCH}\` にも反映します。衝突があれば、この PR の上で解消してください。マージコミット（Create a merge commit）でマージしてください。")"
            gh pr edit "${url##*/}" --add-label 'リリース' \
              || echo "::warning::ラベル「リリース」を付けられなかった"
          fi
          echo "- ${DEVELOP_BRANCH}: PR で取り込む ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: リリースブランチを消す
        # マージ済みのブランチを残すと、次のリリースの「release/* が残っていないか」の確認に引っかかる
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git push origin --delete "${BRANCH}"
            echo "ブランチ ${BRANCH} を消した"
          else
            echo "ブランチ ${BRANCH} はすでに無い"
          fi
