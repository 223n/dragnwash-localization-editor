name: リリース

# 版を入力すると、develop から release/vX.Y.Z ブランチを切り、版を上げて main への PR を開く。
#
#   develop ──▶ release/vX.Y.Z ──(PR)──▶ main ──▶ タグ vX.Y.Z と GitHub Release ──▶ develop へ戻す
#
# 切る前に、develop の先端のコミットで CI（ci.yml）が通ったことを確かめる。
# 走っている途中なら終わるまで待ち（上限30分）、通っていなければ止める。
#
# PR を人がマージすると「リリースを公開する」（release-publish.yml）が動き、
# タグと GitHub Release を作って main を develop に戻す。
#
# GITHUB_TOKEN が開いた PR では、pull_request の実行（CI、CodeQL、branch-guard）は「承認待ち」で作られ、
# 書き込み権限のある人が PR の「Approve workflows to run」を押すまで動かない（2026年6月からの GitHub の動き）。
# 人がマージするときは、承認して CI が通ってからマージする。CI はリリースする木そのもの（develop の先端に
# main を取り込み、版を上げたもの）で走り、このワークフローでは走らない画面の E2E と Windows のテストも通る。
# 承認せずにマージすると、承認待ちの実行は PR を閉じたときに期限切れになり、失敗として Actions に残る
# （v0.10.0 と v0.11.0 がそうだった。main のコミットの判定には響かない）。
#
# auto_merge を有効にすると、人手を挟まずにこのワークフローの中で PR をマージし、公開まで進める。
# 人が承認できないので、代わりに release ブランチで CI（ci.yml）を workflow_dispatch で動かし、通るのを待つ。
# マージの前に、PR の承認待ちの実行を取り消す。期限切れの失敗ではなく、取り消しとして残すためである。
# ただし main に必須のチェックや承認のルールがあると、auto_merge はマージの前で止まることがある。
# PR の実行は承認されないままなので、必須のチェックが埋まらないためである
# （release ブランチの workflow_dispatch の実行で埋まるかは確かめていない）。
# 塞がれていると分かったときは、承認待ちの実行を取り消さずに止まる。
# その場合は人が承認して CI が通ってから PR をマージすれば、release-publish.yml が動いて公開まで進む。
#
# PR は必ずマージコミット（Create a merge commit）でマージする。
# squash や rebase にすると、リリースノートに develop で取り込んだ PR が載らず、次の版の PR が衝突する。
#
# 一度だけ要る設定:
#   Settings > Actions > General > Workflow permissions で
#   「Allow GitHub Actions to create and approve pull requests」を有効にする。
#   これが無いと gh pr create が拒まれる。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースする版。v は付けない（例: 1.2.0、1.2.0-rc.1）'
        required: true
        type: string
      auto_merge:
        description: 'PR を人手で確認せず、そのままマージしてタグと GitHub Release まで進める'
        required: false
        type: boolean
        default: false

# リリースは同時に1つだけ動かす。途中の実行を止めると半端な状態が残るため、待たせる
concurrency:
  group: release
  cancel-in-progress: false

# 既定は読み取りだけにする。要る権限は各ジョブで足す
permissions:
  contents: read

env:
  DEVELOP_BRANCH: develop
  MAIN_BRANCH: main

jobs:
  prepare:
    name: リリースブランチとPRを作る
    # セルフホストのランナーがあれば、リポジトリの変数 RUNS_ON にそのラベル（例: self-hosted）を設定する。
    # 無ければ GitHub がホストする ubuntu-latest で動く
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # develop の CI を待つ上限（30分）に、ブランチを切って PR を開くまでの分を足す
    timeout-minutes: 45
    permissions:
      contents: write        # release ブランチを押す
      pull-requests: write   # PR を開く
      actions: read          # develop の CI の実行を読む
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.version.outputs.branch }}
      head_sha: ${{ steps.push.outputs.sha }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_url: ${{ steps.pr.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: GitHub CLIがあることを確かめる
        # GitHub がホストするランナーには入っている。セルフホストのランナーでは自分で入れる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）が無い。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: 版の書式を確かめる
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          # semver.org が示す正規表現。先頭の 0 や空の識別子（rc..1）は通さない
          num='(0|[1-9][0-9]*)'
          ident='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^${num}\.${num}\.${num}(-${ident}(\.${ident})*)?$"
          if ! printf '%s' "${version}" | grep -Eq "${re}"; then
            echo "::error::版の書式が違う: ${INPUT_VERSION}（例: 1.2.0、1.2.0-rc.1）"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "branch=release/v${version}"
          } >> "$GITHUB_OUTPUT"

      - name: developブランチがあることを確かめる
        # 無いまま checkout に進むと、原因の分かりにくい失敗になる
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${DEVELOP_BRANCH}" --silent 2>/dev/null; then
            echo "::error::${DEVELOP_BRANCH} ブランチが無い。main から作ってから実行する"
            exit 1
          fi

      - name: developのCIが通ったことを確かめる
        id: ci
        # 出すのは develop の先端の木である。その木で CI（ci.yml）の Go のテスト、画面の E2E、lint が
        # 通ったかを確かめる。このワークフローの中で走らせる検査は npm run lint だけで、GITHUB_TOKEN が開く
        # リリースの PR の CI は、人が承認するまで動かない。確かめないと、CI が落ちている木や走っている途中の
        # 木からでも、不変の Release（あとで直せない）が公開される。
        #
        # 過去のリリースの4割は、develop の CI が終わる前に起動していた（PR をマージしてすぐ実行するため）。
        # 走っている途中なら止めずに、終わるまで待つ。上限は CI_WAIT_MINUTES 分で、CI のいちばん長い
        # ジョブの上限（20分）に、ランナーを待つ時間を足した長さにしてある。
        #
        # 見るのは、先端の SHA に対する push の実行である。GITHUB_TOKEN が押したコミットには push の実行が
        # 作られないので、push の実行が無いときだけ、同じ SHA を develop で手で動かした実行
        # （workflow_dispatch）を代わりに見る。どちらも無ければ、手で動かすよう案内して止める。
        # 結論が success 以外なら止める。cancelled（concurrency で止められたもの）も、
        # 通ったかを確かめていないとして止める
        env:
          CI_WORKFLOW: ci.yml
          # 待つ上限（分）。実行が1つも無いときは、作られるのを CI_APPEAR_MINUTES 分だけ待つ
          CI_WAIT_MINUTES: '30'
          CI_APPEAR_MINUTES: '5'
          CI_POLL_SECONDS: '20'
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEVELOP_BRANCH}" --jq '.commit.sha')"
          if [ -z "${sha}" ]; then
            echo "::error::${DEVELOP_BRANCH} の先端の SHA を取れなかった"
            exit 1
          fi
          echo "${DEVELOP_BRANCH} の先端: ${sha}"

          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${sha}&branch=${DEVELOP_BRANCH}&per_page=100"
          # 新しい順に返る。push の実行を先に並べ、無ければ workflow_dispatch の実行を使う
          pick='[.workflow_runs[] | select(.event == "push")] + [.workflow_runs[] | select(.event == "workflow_dispatch")]
            | first | select(. != null) | [.status, (.conclusion // "none"), .html_url, .event] | join(" ")'

          started="$(date +%s)"
          api_failures=0
          status=''
          conclusion=''
          url=''
          event=''
          while :; do
            elapsed=$(( $(date +%s) - started ))
            if ! line="$(gh api "${runs}" --jq "${pick}")"; then
              # 一時的な失敗で、リリースごと止めない。続けて落ちるなら権限などの問題なので止める
              api_failures=$((api_failures + 1))
              if [ "${api_failures}" -ge 3 ]; then
                echo "::error::CI（${CI_WORKFLOW}）の実行を3回続けて引けなかった。Actions の画面で ${DEVELOP_BRANCH} の CI を確かめてから、もう一度実行する"
                exit 1
              fi
              echo "::warning::CI の実行を引けなかった。${CI_POLL_SECONDS}秒後に引き直す"
            elif [ -z "${line}" ]; then
              api_failures=0
              if [ "${elapsed}" -ge $((CI_APPEAR_MINUTES * 60)) ]; then
                echo "::error::${DEVELOP_BRANCH} の先端 ${sha} に CI（${CI_WORKFLOW}）の実行が無い。Actions の「CI」を ${DEVELOP_BRANCH} で手動実行し（Run workflow）、通ってからもう一度実行する"
                exit 1
              fi
              echo "CI の実行がまだ無い。作られるのを待つ（${elapsed}秒経過）"
            else
              api_failures=0
              read -r status conclusion url event <<<"${line}"
              if [ "${status}" = 'completed' ]; then
                break
              fi
              echo "CI（${event}）は ${status}。終わるのを待つ（${elapsed}秒経過）: ${url}"
            fi
            if [ "${elapsed}" -ge $((CI_WAIT_MINUTES * 60)) ]; then
              echo "::error::CI が ${CI_WAIT_MINUTES} 分たっても終わらない。実行の画面で様子を確かめ、終わってからもう一度このワークフローを実行する: ${url:-（実行がまだ無い）}"
              exit 1
            fi
            sleep "${CI_POLL_SECONDS}"
          done

          if [ "${conclusion}" != 'success' ]; then
            if [ "${conclusion}" = 'cancelled' ]; then
              reason='止められた（cancelled）ため、通ったかを確かめていない'
            else
              reason="通っていない（${conclusion}）"
            fi
            echo "::error::${DEVELOP_BRANCH} の先端 ${sha} の CI は${reason}。落ちた原因を直すか、揺れや取り消しなら実行の画面の「Re-run jobs」で入れ直し、通ってからもう一度このワークフローを実行する: ${url}"
            exit 1
          fi
          echo "CI が通ったことを確かめた（${event}）: ${url}"
          {
            echo "sha=${sha}"
            echo "run_url=${url}"
          } >> "$GITHUB_OUTPUT"

      - name: developを取得
        # zizmor: ignore[artipacked] このジョブは release ブランチを push するため、認証情報を残す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI を確かめた SHA そのものを取る。ブランチの名前で取ると、確かめている間に develop が
          # 進んだとき、CI を確かめていない木からリリースを切ってしまう
          ref: ${{ steps.ci.outputs.sha }}
          # 最新のタグと main の版と比べるため、履歴とタグをすべて取る
          fetch-depth: 0

      - name: Nodeを用意
        # 版の比較にも node を使うため、その前に用意する。セルフホストのランナーに Node が無くても動く
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: タグとブランチが未使用で、版が新しいことを確かめる
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::タグ ${TAG} はすでにある"
            exit 1
          fi
          # release ブランチは同時に1つだけ。別の版が開いたままだと、後の PR が package.json で衝突する
          if git ls-remote --exit-code --heads origin 'refs/heads/release/*' >/dev/null 2>&1; then
            echo "::error::release/* ブランチが残っている。前のリリースの PR をマージするか閉じてから実行する"
            git ls-remote --heads origin 'refs/heads/release/*'
            exit 1
          fi

          # 今の版より大きいことを確かめる。
          # 基準は develop の版だけでなく、main の版と最新のタグも見る。
          # 前のリリースの戻しが止まっていると develop の版が古いままになるためである。
          # 比べ方は semver の 11 項に従う。識別子を . で分け、数字どうしは数値、英字は文字列で比べ、
          # 数字と英字なら数字が小さい。数字が同じなら正式版がプレリリースより大きい
          current="$(node -p "require('./package.json').version")"
          main_version="$(git show "origin/${MAIN_BRANCH}:package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || true)"
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "develop: ${current} / main: ${main_version:-無し} / 最新のタグ: ${latest_tag:-無し}"

          node -e '
            const [next, ...bases] = process.argv.slice(1)
            const parse = (v) => {
              const [core, ...pre] = v.split("-")
              return { core: core.split(".").map(Number), pre: pre.join("-") }
            }
            const cmpIdent = (a, b) => {
              const an = /^[0-9]+$/.test(a)
              const bn = /^[0-9]+$/.test(b)
              if (an && bn) return Math.sign(Number(a) - Number(b))
              if (an) return -1
              if (bn) return 1
              return a < b ? -1 : a > b ? 1 : 0
            }
            const cmpPre = (a, b) => {
              if (!a && !b) return 0
              if (!a) return 1
              if (!b) return -1
              const as = a.split(".")
              const bs = b.split(".")
              for (let i = 0; i < Math.max(as.length, bs.length); i += 1) {
                if (as[i] === undefined) return -1
                if (bs[i] === undefined) return 1
                const c = cmpIdent(as[i], bs[i])
                if (c !== 0) return c
              }
              return 0
            }
            const compare = (a, b) => {
              const pa = parse(a)
              const pb = parse(b)
              for (let i = 0; i < 3; i += 1) {
                const c = Math.sign(pa.core[i] - pb.core[i])
                if (c !== 0) return c
              }
              return cmpPre(pa.pre, pb.pre)
            }
            for (const base of bases.filter(Boolean)) {
              const c = compare(next, base)
              if (c === 0) {
                console.log("::error::" + next + " は今の版と同じである")
                process.exit(1)
              }
              if (c < 0) {
                console.log("::error::" + next + " は今の版 " + base + " より小さい")
                process.exit(1)
              }
            }
            console.log("版: " + bases.filter(Boolean).join(", ") + " → " + next)
          ' "${VERSION}" "${current}" "${main_version}" "${latest_tag#v}"

      - name: リリースブランチを切って版を上げる
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "${BRANCH}"

          # 共通の祖先が無いと、木の中身が同じでも merge は必ず拒まれる。
          # テンプレートから「Include all branches」で作ったリポジトリがこの状態になる。
          # 先に確かめて、原因の分かる形で止める
          if ! git merge-base "origin/${MAIN_BRANCH}" HEAD >/dev/null 2>&1; then
            echo "::error::${MAIN_BRANCH} と ${DEVELOP_BRANCH} に共通の祖先が無い。README の「履歴が繋がっていないとき」を見て直してから実行する"
            exit 1
          fi

          # main の内容を先に取り込む。前のリリースの戻しが develop に入っていなくても、
          # main への PR が package.json で衝突しないようにする。普段は何も変わらない
          if ! git merge --no-edit "origin/${MAIN_BRANCH}"; then
            # マージが始まる前に拒まれたときは MERGE_HEAD が無く、git merge --abort 自体が失敗する。
            # 既定のシェルは bash -e なので、そのままだと下の案内が出ないまま落ちる
            git merge --abort || true
            echo "::error::${MAIN_BRANCH} と ${DEVELOP_BRANCH} が衝突する。先に ${MAIN_BRANCH} を ${DEVELOP_BRANCH} に取り込んでから実行する"
            exit 1
          fi

          # package.json と package-lock.json の版を書き換える。タグはまだ打たない
          npm version "${VERSION}" --no-git-tag-version
          actual="$(node -p "require('./package.json').version")"
          if [ "${actual}" != "${VERSION}" ]; then
            echo "::error::package.json の版が ${VERSION} にならなかった（${actual}）"
            exit 1
          fi

      - name: 検査を通す
        # 壊れたものをリリースブランチに載せない。
        # GITHUB_TOKEN が開いた PR の CI は「承認待ち」で作られ、人が承認するまで動かないため、ここで検査しておく
        run: npm run lint

      - name: コミットして押す
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          git add package.json package-lock.json
          git commit -m "版を ${VERSION} に上げる"
          git push --set-upstream origin "${BRANCH}"
          # PR の先端になるコミット。auto_merge の経路で、CI を走らせる木とマージする木を揃えるのに使う
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: リリースノートの下書きを作る
        # タグはまだ無いが、generate-notes は新しいタグ名でも受け付ける
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            --method POST \
            -f tag_name="${TAG}" \
            -f target_commitish="${BRANCH}" \
            --jq '.body' > notes.md \
            || { echo "::warning::リリースノートの下書きを作れなかった"; : > notes.md; }

      - name: PRを開く
        id: pr
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
          CI_SHA: ${{ steps.ci.outputs.sha }}
          CI_RUN_URL: ${{ steps.ci.outputs.run_url }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          {
            echo "\`${DEVELOP_BRANCH}\` の内容を ${TAG} としてリリースします。"
            echo
            echo "**マージコミット（Create a merge commit）でマージしてください。** squash や rebase は使いません。"
            echo
            echo "## マージの前に"
            echo
            if [ "${AUTO_MERGE}" = 'true' ]; then
              echo "\`auto_merge\` で動いています。人の承認とマージは要りません。"
              echo "ワークフローがこのブランチで CI を動かし、通ったら、この PR の承認待ちの実行を取り消してからマージします。"
              echo "止まったときは、ワークフローの実行の画面に理由と次にすることが出ます。"
              echo "止まって人がマージするときは、この PR に「Approve workflows to run」が出ていれば押し、CI が通ってからにしてください。承認せずにマージすると、承認待ちの実行は PR を閉じたときに期限切れになり、失敗として Actions に残ります。"
            else
              echo "この PR は GitHub Actions が開いたため、CI などの実行は「承認待ち」で作られます。"
              echo "**「Approve workflows to run」を押し、CI が通ってからマージしてください。**"
              echo
              echo "- CI は、リリースする木そのもの（\`${DEVELOP_BRANCH}\` の先端に \`${MAIN_BRANCH}\` を取り込み、版を上げたもの）で走ります。ワークフローの中では走らない画面の E2E と Windows のテストも、ここで通ります"
              echo "- 承認せずにマージすると、承認待ちの実行は PR を閉じたときに期限切れになり、失敗として Actions に残ります"
            fi
            echo
            echo "この PR をマージすると「リリースを公開する」ワークフローが動き、次を行います。"
            echo
            echo "1. タグ \`${TAG}\` を打ちます"
            echo "1. GitHub Release を作ります"
            echo "1. \`${MAIN_BRANCH}\` を \`${DEVELOP_BRANCH}\` に戻します"
            echo
            echo "\`${DEVELOP_BRANCH}\` の先端（${CI_SHA}）で CI が通ったことを確かめてから、このブランチを切っています: ${CI_RUN_URL}"
            echo "版を上げたあとの検査（\`npm run lint\`）もワークフローの中で済んでいます。"
            echo
            echo "## 変更の一覧（下書き）"
            echo
            cat notes.md
          } > body.md

          url="$(gh pr create \
            --base "${MAIN_BRANCH}" \
            --head "${BRANCH}" \
            --title "リリース ${TAG}" \
            --body-file body.md)"
          number="${url##*/}"
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN が開いた PR ではラベラーが動かないため、ここで付ける。
          # ラベルが無いリポジトリでも PR は開けるようにする
          gh pr edit "${number}" --add-label 'リリース' \
            || echo "::warning::ラベル「リリース」を付けられなかった。.github/labels.yml の同期が済んでいるか確かめる"

          {
            echo "## リリース ${TAG}"
            echo
            echo "- PR: ${url}"
            echo "- ブランチ: \`${BRANCH}\`"
            echo "- ${DEVELOP_BRANCH} の CI: ${CI_RUN_URL}"
            if [ "${AUTO_MERGE}" != 'true' ]; then
              echo "- PR の「Approve workflows to run」を押し、CI が通ってからマージする"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: PRをマージする
    if: inputs.auto_merge
    needs: prepare
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    # release ブランチの CI を待つ上限（30分）に、実行が作られるのを待つ分（5分）と、
    # 承認待ちの実行を取り消してマージする分を足す
    timeout-minutes: 45
    permissions:
      contents: write        # PR をマージし、release ブランチを消す
      pull-requests: write   # PR をマージする
      actions: write         # release ブランチで CI を動かし、PR の承認待ちの実行を取り消す
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      PR_URL: ${{ needs.prepare.outputs.pr_url }}
    steps:
      - name: GitHub CLIがあることを確かめる
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh（GitHub CLI）が無い。ランナーに入れてから実行する: https://cli.github.com/"
            exit 1
          fi

      - name: リリースブランチでCIを走らせて待つ
        # auto_merge では、人が PR の「Approve workflows to run」を押さない。PR の CI の代わりに、
        # release ブランチで CI（ci.yml）を workflow_dispatch で動かし、通るのを待ってからマージする。
        # GITHUB_TOKEN が起こすイベントのうち、workflow_dispatch は実行を作れる。
        # 走るのはリリースする木そのもの（develop の先端に main を取り込み、版を上げたもの）で、
        # 公開のワークフローが走らせない画面の E2E と Windows のテストも、ここで通る。
        #
        # 待ち方は prepare の「developのCIが通ったことを確かめる」と同じにする。上限は CI_WAIT_MINUTES 分で、
        # 実行が作られるのを CI_APPEAR_MINUTES 分だけ待つ。結論が success 以外なら止め、PR は開いたままにする。
        # 動かした実行は、動かす前から同じ SHA にあった実行（手で動かしたものや、このジョブの前の試行のもの）を
        # 除いて見分ける。ci.yml の concurrency の組は ref とイベントを含むので、PR の承認待ちの実行とは
        # 互いに止め合わない
        #
        # 止まったときは、ここより後の段（取り消し）に進まないので、PR の実行は承認待ちのまま残る。
        # そのため、どの案内でも、人がマージするなら「Approve workflows to run」を押して CI が通ってからにする、と出す。
        # 一時の失敗（CI の揺れや API の失敗）なら、この「リリース」の実行の「Re-run failed jobs」でも進められる。
        # merge ジョブと、それに続く publish ジョブが入れ直され、前の試行で動かした実行は除いて見分ける。
        # 「Re-run all jobs」は、release ブランチが残っているため prepare の「タグとブランチが未使用で、版が新しいことを確かめる」で止まる
        env:
          CI_WORKFLOW: ci.yml
          CI_WAIT_MINUTES: '30'
          CI_APPEAR_MINUTES: '5'
          CI_POLL_SECONDS: '20'
        run: |
          by_hand='PR は開いたままにしてある。PR の「Approve workflows to run」を押し、CI が通ってから人がマージする（押さずにマージすると、承認待ちの実行が期限切れの失敗として残る）'
          rerun='一時の失敗なら、この「リリース」の実行の「Re-run failed jobs」で入れ直してもよい（CI を動かし直し、通れば承認待ちの実行を取り消して、マージと公開まで進む）'

          # release ブランチが prepare の押したコミットのままかを見る。動いていると、CI を走らせる木と
          # マージする木が食い違う
          if ! tip="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --jq '.commit.sha')"; then
            echo "::error::${BRANCH} の先端の SHA を取れなかった。${by_hand}。${rerun}: ${PR_URL}"
            exit 1
          fi
          if [ "${tip}" != "${HEAD_SHA}" ]; then
            echo "::error::${BRANCH} の先端（${tip:-空}）が、このワークフローの押したコミット（${HEAD_SHA}）と違う。PR の中身を確かめる。${by_hand}: ${PR_URL}"
            exit 1
          fi

          runs="repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/runs?head_sha=${HEAD_SHA}&branch=${BRANCH}&event=workflow_dispatch&per_page=100"
          if ! before="$(gh api "${runs}" --jq '[.workflow_runs[].id | tostring] | join(",")')"; then
            echo "::error::CI（${CI_WORKFLOW}）の実行を引けなかった。${by_hand}。${rerun}: ${PR_URL}"
            exit 1
          fi
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW}/dispatches" \
            -f ref="${BRANCH}" --silent; then
            echo "::error::${BRANCH} で CI（${CI_WORKFLOW}）を動かせなかった。${by_hand}: ${PR_URL}"
            exit 1
          fi
          echo "${BRANCH} で CI（${CI_WORKFLOW}）を動かした"

          # 新しい順に返る。動かす前からあった id を除いた、いちばん新しい実行を見る
          pick='[.workflow_runs[] | select([.id] | inside(['"${before}"']) | not)]
            | first | select(. != null) | [.status, (.conclusion // "none"), .html_url] | join(" ")'

          started="$(date +%s)"
          api_failures=0
          status=''
          conclusion=''
          url=''
          while :; do
            elapsed=$(( $(date +%s) - started ))
            if ! line="$(gh api "${runs}" --jq "${pick}")"; then
              api_failures=$((api_failures + 1))
              if [ "${api_failures}" -ge 3 ]; then
                echo "::error::CI（${CI_WORKFLOW}）の実行を3回続けて引けなかった。${by_hand}。${rerun}: ${PR_URL}"
                exit 1
              fi
              echo "::warning::CI の実行を引けなかった。${CI_POLL_SECONDS}秒後に引き直す"
            elif [ -z "${line}" ]; then
              api_failures=0
              if [ "${elapsed}" -ge $((CI_APPEAR_MINUTES * 60)) ]; then
                echo "::error::${BRANCH} で動かした CI（${CI_WORKFLOW}）の実行が、${CI_APPEAR_MINUTES} 分たっても作られない。${by_hand}: ${PR_URL}"
                exit 1
              fi
              echo "CI の実行がまだ無い。作られるのを待つ（${elapsed}秒経過）"
            else
              api_failures=0
              read -r status conclusion url <<<"${line}"
              # workflow_dispatch の実行まで承認待ちで作られるようになったら、待っても進まない。
              # 入れ直しても同じく承認待ちになるので、人がマージする道だけを案内する
              if [ "${status}" = 'action_required' ] || [ "${conclusion}" = 'action_required' ]; then
                echo "::error::${BRANCH} で動かした CI が承認待ちで作られた。${by_hand}。PR: ${PR_URL} CI の実行: ${url}"
                exit 1
              fi
              if [ "${status}" = 'completed' ]; then
                break
              fi
              echo "CI は ${status}。終わるのを待つ（${elapsed}秒経過）: ${url}"
            fi
            # 入れ直すと、動かした実行を ci.yml の concurrency で止めて、また同じ上限で待つだけなので、勧めない
            if [ "${elapsed}" -ge $((CI_WAIT_MINUTES * 60)) ]; then
              echo "::error::CI が ${CI_WAIT_MINUTES} 分たっても終わらない。${by_hand}。PR: ${PR_URL} CI の実行: ${url:-まだ無い}"
              exit 1
            fi
            sleep "${CI_POLL_SECONDS}"
          done

          if [ "${conclusion}" != 'success' ]; then
            if [ "${conclusion}" = 'cancelled' ]; then
              reason='止められた（cancelled）ため、通ったかを確かめていない'
            else
              reason="通っていない（${conclusion}）"
            fi
            echo "::error::${BRANCH} の CI は${reason}。${by_hand}。${rerun}。直すべき不具合なら PR を閉じて ${BRANCH} を消し、develop で直してからやり直す。PR: ${PR_URL} CI の実行: ${url}"
            exit 1
          fi
          echo "CI が通ったことを確かめた: ${url}"
          echo "- ${BRANCH} の CI: ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: マージできる状態かを確かめる
        # main のルール（必須のチェックや承認）で塞がれているなら、承認待ちの実行を取り消す前に止める。
        # 取り消してしまうと、人が「Approve workflows to run」を押して PR の CI でルールを満たす道が無くなる。
        # 状態を引けなかったとき（UNKNOWN を含む）は、止めずに進める。塞がれていれば、マージの段で止まる
        run: |
          if ! state="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json mergeStateStatus --jq '.mergeStateStatus')"; then
            echo "::warning::PR のマージの状態を引けなかった。確かめずに進める"
            exit 0
          fi
          echo "PR のマージの状態: ${state:-空}"
          if [ "${state}" = 'BLOCKED' ]; then
            echo "::error::PR のマージが ${MAIN_BRANCH} のルール（必須のチェックや承認）で塞がれている。承認待ちの実行は取り消さずに残した。PR の「Approve workflows to run」を押し、CI が通ってから人がマージすれば、「リリースを公開する」が動いて公開まで進む: ${PR_URL}"
            exit 1
          fi

      - name: 承認待ちのPRの実行を取り消す
        # GITHUB_TOKEN が開いた PR の pull_request の実行（CI、CodeQL、branch-guard）は承認待ちで作られる。
        # 承認しないままマージすると、PR を閉じたときに期限切れになり、失敗として Actions に残る。
        # auto_merge では人が承認できないので、マージの前に PR の先端の SHA の承認待ちの実行を取り消し、
        # 取り消しとして残す。リリースの中身は、前の段で release ブランチの CI が確かめてある。
        #
        # 承認待ちの実行を API で取り消せるかは、GitHub の文書に書かれていない。拒まれても失敗にせず、
        # 警告を出して進める。赤い実行が Actions に残るだけで、リリースの中身には響かない。
        # 実行が作られるのを PENDING_APPEAR_SECONDS 秒まで待つ。取り消したら引き直し、新しく出てこなくなったら終える。
        # 状態は status と conclusion のどちらに action_required が入っても拾う
        env:
          PENDING_APPEAR_SECONDS: '60'
          PENDING_LIMIT_SECONDS: '180'
          PENDING_POLL_SECONDS: '10'
        run: |
          runs="repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100"
          pick='.workflow_runs[]
            | select(.event == "pull_request" or .event == "pull_request_target")
            | select(.status == "action_required" or .conclusion == "action_required")
            | [(.id | tostring), (.name // ""), (.html_url // "")] | join("\t")'

          started="$(date +%s)"
          api_failures=0
          attempted=' '
          accepted=0
          refused=0
          still=''
          listed=false
          while :; do
            elapsed=$(( $(date +%s) - started ))
            if ! list="$(gh api "${runs}" --jq "${pick}")"; then
              api_failures=$((api_failures + 1))
              if [ "${api_failures}" -ge 3 ]; then
                echo "::warning::承認待ちの実行を3回続けて引けなかった。取り消さずにマージへ進む。PR を閉じると、承認待ちの実行は期限切れの失敗として残る: ${PR_URL}"
                break
              fi
              echo "::warning::承認待ちの実行を引けなかった。${PENDING_POLL_SECONDS}秒後に引き直す"
            else
              api_failures=0
              listed=true
              new=0
              still=''
              while IFS=$'\t' read -r id name url <&3; do
                if [ -z "${id}" ]; then
                  continue
                fi
                case "${attempted}" in
                  *" ${id} "*)
                    # 取り消しを頼んだのに、まだ承認待ちのまま
                    still="${still}${name} ${url}"$'\n'
                    continue
                    ;;
                esac
                attempted="${attempted}${id} "
                new=$((new + 1))
                if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" --silent </dev/null; then
                  accepted=$((accepted + 1))
                  echo "取り消しを頼んだ: ${name} ${url}"
                else
                  refused=$((refused + 1))
                  echo "::warning::承認待ちの実行を取り消せなかった。PR を閉じると期限切れの失敗として残る: ${name} ${url}"
                fi
              done 3<<<"${list}"
              if [ "${new}" -eq 0 ]; then
                # 取り消したあとに引き直して、新しく出てこなければ終える
                if [ "${attempted}" != ' ' ]; then
                  break
                fi
                if [ "${elapsed}" -ge "${PENDING_APPEAR_SECONDS}" ]; then
                  break
                fi
              fi
            fi
            if [ "${elapsed}" -ge "${PENDING_LIMIT_SECONDS}" ]; then
              echo "::warning::承認待ちの実行の取り消しを ${PENDING_LIMIT_SECONDS} 秒で打ち切った。マージへ進む"
              break
            fi
            sleep "${PENDING_POLL_SECONDS}"
          done

          if [ "${attempted}" = ' ' ]; then
            if [ "${listed}" = 'true' ]; then
              echo "::notice::PR の先端（${HEAD_SHA}）に承認待ちの pull_request の実行は無かった"
              echo "- 承認待ちの実行: 取り消すものは無かった" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- 承認待ちの実行: 引けなかったため、取り消していない" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ -n "${still}" ]; then
            echo "::warning::取り消しを頼んだが、まだ承認待ちの実行がある。PR を閉じると期限切れの失敗として残る"
            printf '%s' "${still}"
          fi
          {
            echo "- 承認待ちの実行: 取り消しを受け付けた ${accepted} 件、拒まれた ${refused} 件"
            if [ -n "${still}" ]; then
              echo "- 取り消しを頼んだあとも承認待ちのまま:"
              printf '%s' "${still}" | sed 's/^/  - /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PRをマージする
        # マージコミットで取り込む。CI を確かめたコミットのままのときだけマージする（--match-head-commit）。
        # main のルール（必須のチェックや承認）で止められた場合はここで失敗する。
        # その場合は人が PR をマージすれば、release-publish.yml が pull_request(closed) で動いて公開まで進む。
        # 前の段で取り消せなかった承認待ちの実行が残っていれば、人が承認して CI が通ってからマージする
        run: |
          if ! gh pr merge "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --merge --delete-branch --match-head-commit "${HEAD_SHA}"; then
            echo "::error::PR をマージできなかった。${MAIN_BRANCH} のルール（必須のチェックや承認）で止められたか、PR の先端が ${HEAD_SHA} から動いた。${BRANCH} の CI は通っている。人が PR をマージすれば、「リリースを公開する」が動いて公開まで進む。PR の画面に「Approve workflows to run」が出ていれば（承認待ちの実行を取り消せなかったとき）、押して CI が通ってからマージする（押さずにマージすると、承認待ちの実行が期限切れの失敗として残る）: ${PR_URL}"
            exit 1
          fi

  publish:
    name: タグとGitHub Releaseを作る
    # GITHUB_TOKEN でマージしても pull_request(closed) のワークフローは動かないため、ここから呼ぶ
    if: inputs.auto_merge
    needs: [prepare, merge]
    # GitHub の $/ 構文（自リポジトリ参照）は actionlint 1.7.12 がまだ理解しないため、./ のままにする
    uses: ./.github/workflows/release-publish.yml # zizmor: ignore[self-repository] actionlint が $/ に未対応
    # 呼ばれる側のジョブが求める権限を、呼ぶ側でもすべて渡す。1つでも欠けると、
    # ジョブが1つも動かないまま startup_failure で止まる（v0.12.0 の最初の実行がそうなった）
    permissions:
      contents: write
      pull-requests: write
      actions: write         # develop へ直接戻したとき、develop の CI を workflow_dispatch で動かす
    with:
      version: ${{ needs.prepare.outputs.version }}
