<!DOCTYPE html>
<!--
  画面の骨組み。文言は1つも書かない。すべて app.js が目録（/api/bootstrap）から
  埋める。ここに日本語を書くと、目録を英語にしても残る文字列ができてしまう。

  lang と dir の初期値は、目録が届くまでの暫定。届いたら app.js が書き換える。

  題名（title）は "dwloc" のまま始める。題名はブラウザーの履歴に残るので、
  原文はもちろん、行の中身になりうる値を一切入れない。

  配置は3つに分かれる。

    .top      貼り付く帯。保存の状態と、競合の引き止めと、失敗の理由
    .sidebar  絞り込み・検索と、畳んだ説明（キー操作、断り書き、起動時の状態）
    .content  一覧

  広い画面では .sidebar を左に置き、一覧は最上段から始まる。狭い画面
  （900px 以下）では .sidebar を引き出しにして、帯のボタン（#menu）かスラッシュで
  開く。絞り込みを一覧の上に積まないのは、積むと一覧の始まりが下がるうえ、
  帯の中へ入れると競合の引き止めのボタンが押し出されるからである
  （.top の注記と app.css の .sidebar を見よ）。
-->

-->

<!--
  上に貼り付けておく一帯。保存の状態と、競合の引き止めと、失敗の理由を入れる。

  貼り付けるのは、1839行の途中で競合が起きても決断用のボタンが画面に残るように
  するためである。貼り付けないと、ボタンは画面の55,000px 上にあり、そのあいだ
  自動保存は止まったままになる（実際に起きた）。

  ここへ入れるのは bar / message / conflict / orphans の4つだけにする。足すと、
  その高さのぶんだけ競合の引き止めが下へ押し出される。一帯は max-height: 50vh で
  止めてあるので、あふれたぶんは一帯の中でスクロールアウトし、決断用のボタンが
  押せなくなる（絞り込みの一帯を入れていたときに 800x600 で実際に起きた）。
-->
<div class="top">
  <header class="bar">
    <!--
      サイドバーの開閉。広い画面では左の列を畳んで一覧を広げ、狭い画面では
      引き出しを開く。名前（aria-label）は目録から入れる。aria-controls で
      どの領域を開閉するかを結び、aria-expanded を app.js が保つ。
    -->
    <button id="menu" class="btn btn-icon" type="button" aria-controls="sidebar" aria-expanded="true">
      <svg class="icon" aria-hidden="true"><use href="#i-bars"/></svg>
    </button>
    <h1 class="brand">
      <svg class="icon" aria-hidden="true"><use href="#i-language"/></svg>
      <span id="app-title">dwloc</span>
    </h1>
    <label class="field">
      <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
      <span id="locale-label"></span>
      <select id="locale"></select>
    </label>
    <button id="reload" class="btn" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-rotate-right"/></svg>
      <span id="reload-label"></span>
    </button>
    <span class="pill">
      <svg class="icon" aria-hidden="true"><use href="#i-list-ol"/></svg>
      <span id="rows" class="rows"></span>
    </span>
    <!--
      いま何行出ているか。絞り込みと検索の唯一の手応えなので、条件の一帯ではなく
      常に見えているこの帯へ置く。読み上げにも出す（aria-live）。0行になったことは
      一覧の場所にも文言で出す（#empty）。
    -->
    <span class="pill">
      <svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg>
      <span id="shown" class="shown" aria-live="polite"></span>
    </span>
    <!--
      保存の状態。保存済み／保存しています／未保存 N 件／保存できません／競合。
      黙って成功したように見せないための欄で、文言とアイコンは app.js が入れる。
      読み上げにも出す。黙って失敗しないことは、目で見ている人だけの約束ではない。
    -->
    <span id="save-state" class="save-state" aria-live="polite"></span>
  </header>

  <!--
    失敗の理由。読み上げにも出す（role="status"）。

    hidden を出し入れしない。hidden の要素は支援技術の木から外れるので、
    文字が変わる瞬間にこの要素が木に居らず、告知しない実装があり得る。
    出し入れは中身の入れ替えで行い、空のときは app.css の .notice:empty が
    余白と下線を落とす（中身の無いブロックの高さは0になる）。
  -->
  <p id="message" class="notice error" role="status"></p>

  <!--
    競合（409）の引き止め。手前でファイルが変わったとき、どちらの編集を載せるかを
    人に選ばせる。黙って上書きも、黙って破棄もしない。ボタンは2つとも type="button"
    で、form は使わない（CSP の form-action 'none' と、CSRF の入口を増やさないため）。
  -->
  <section id="conflict" class="conflict" hidden>
    <p class="lead">
      <svg class="icon" aria-hidden="true"><use href="#i-code-merge"/></svg>
      <span id="conflict-title"></span>
    </p>
    <p id="conflict-help"></p>
    <button id="conflict-keep" class="btn btn-primary" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-user-pen"/></svg>
      <span id="conflict-keep-label"></span>
    </button>
    <button id="conflict-take" class="btn" type="button">
      <svg class="icon" aria-hidden="true"><use href="#i-file-import"/></svg>
      <span id="conflict-take-label"></span>
    </button>
  </section>

  <!--
    行き先が見つからなくなった訳。読み直した内容にその行が無いとき、訳を
    捨てずにここへ出す。画面から消さないのは、それが訳の残っている最後の
    場所になるためで、翻訳者が控えるまでは出し続ける。
  -->
  <section id="orphans" class="orphans" hidden>
    <p class="lead">
      <svg class="icon" aria-hidden="true"><use href="#i-link-slash"/></svg>
      <span id="orphans-title"></span>
    </p>
    <ul id="orphans-list" class="orphans-list"></ul>
  </section>
</div>

<div class="shell">
  <!--
    左の列。絞り込みと検索、畳んだ説明を入れる。貼り付く帯（.top）の外にある。

    帯の中に置いていたころは、800x600 で 409 を起こすと競合の引き止めのボタンが
    帯の中でスクロールアウトして押せなくなった。帯の外の、一覧の上に置いていた
    ころは、この一帯だけで 126〜151px（375px 幅では 327px）あり、一覧の始まりが
    そのぶん下がった。左の列にすると、帯の高さにも一覧の始まりにも関わらない。

    広い画面では帯の下に貼り付き、自分の中でスクロールする。狭い画面では
    引き出しになり、#menu かスラッシュで開き、#sidebar-close か #backdrop か
    Escape で閉じる。開閉の状態は body のクラス（sidebar-open / sidebar-collapsed）
    で持ち、どこにも残さない（この道具は画面の状態をどこにも残さないと決めてある）。

    条件も検索語も、URL にも待ち受けへの要求にも載せない。行はもうブラウザーの
    中にあるので、待ち受けに聞く必要がない。聞けば、検索語（＝原文の断片）が
    待ち受けの記録に残りうる。
  -->
  <aside id="sidebar" class="sidebar">
    <section class="finder card">
      <div class="card-header">
        <svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg>
        <span id="finder-title"></span>
        <button id="sidebar-close" class="btn btn-icon sidebar-close" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-xmark"/></svg>
        </button>
      </div>
      <div class="card-body">
        <label class="search">
          <svg class="icon" aria-hidden="true"><use href="#i-magnifying-glass"/></svg>
          <span id="search-label" class="sr-only"></span>
          <!--
            検索の入力欄。綴り検査と自動補正と自動補完を切る。訳の入力欄と同じ理由で、
            ブラウザーの綴り検査は入力の中身を外部のサービスへ送りうる経路である。
            検索語は原文の断片なので、訳と同じ扱いにする。

            type は text にする。search にすると、ブラウザーによっては前に打った語を
            候補として出す。その候補はブラウザー側に残る。

            dir と lang は app.js がロケールに合わせて入れる。訳の入力欄と同じ扱いで、
            he や ar の翻訳者が検索語を打つときにキャレットと並びを合わせる。
          -->
          <input id="search" type="text" class="notranslate" translate="no"
            spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
        </label>
        <span id="filter-label" class="finder-label"></span>
        <!--
          条件の群。role="group" と aria-labelledby が無いと、文脈の無いチェックボックスが
          10個並んでいるようにしか読み上げられない。
        -->
        <span id="filters" class="filters" role="group" aria-labelledby="filter-label"></span>
        <button id="filter-clear" class="btn" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-filter-circle-xmark"/></svg>
          <span id="filter-clear-label"></span>
        </button>
      </div>
    </section>

    <!--
      効くキーを画面から読めるようにする。覚えていないと使えない近道は、
      無いのと同じである。文言は目録から入れる。

      畳んだ状態で始める（open を付けない）。読むのは1度で足りる。左の列に
      移したので一覧を押し下げはしないが、開いたままだと条件の下に長い文が
      居座り、条件の一帯が列の中でスクロールアウトする。

      details/summary にするのは、開閉そのものをブラウザーに任せるためである。
      自前でボタンと hidden を組むと、開閉の状態を読み上げへ伝える仕掛けを自分で
      持つことになる。中の p は id も class もそのまま残す。app.js が書き込む先は
      この p のままで、summary には別の id を当てる。

      目録が届くまでは hidden で出さない。summary は焦点を受ける要素なので、文言の
      入っていない開閉要素が、名前を持たないまま焦点の順に並ぶことになる。
      この画面の畳みは3つとも hidden で始める。出すのは、この2つは目録が届いたとき、
      一帯（#panel-fold）だけは「ファイル」の欄に名前が入ったとき（app.js の render）
      である。あの summary に入るのは目録の文ではなく値なので、目録だけでは名前が
      入らない。

      畳みの中身は告知する欄ではないので、ここは hidden で構わない
      （#message と #empty は role="status" なので hidden にしない。app.js の
      showMessage と applyView の注記を見よ）。
    -->
    <details id="keys-fold" class="fold" hidden>
      <!-- 見出しの中身（アイコン・文言・山形）は app.js の foldTitle が目録から組む。 -->
      <summary id="keys-title"></summary>
      <p id="keys" class="notice keys"></p>
    </details>
    <!--
      絞り込みと検索の断り書き。畳んでおく。

      畳むと読まれなくなる文がある。閉じたままでも読めるのは summary だけなので、
      そこには「無条件に本当のこと」を入れる。いまは検索がブラウザーの中だけで
      完結すること（＝打った語がどこにも残らないこと）を入れてある。

      チップに添えた数が何の数かは、ここではなく .finder の見出し（#filter-label、
      目録の ui.filter）に置いた。畳める場所に置くと、既定では読めない。
    -->
    <details id="finder-fold" class="fold" hidden>
      <summary id="finder-note-title"></summary>
      <p id="finder-note" class="notice keys"></p>
    </details>

    <section class="panel card">
      <!--
        起動したときに1回だけ決まる値を並べる場所。畳んでおく。読むのは1度で
        足りるのに、開いたままだと条件の一帯が列の中でスクロールアウトする。

        ただし畳みきらない。「いま直しているのがどのファイルか」は、この画面で
        いちばん大事な1行である。リポジトリの公開ファイルを直しているのか、
        ゲーム側の作業コピーを直しているのかが、そこにしか出ていない。だから
        #file-path だけは summary の中に置き、畳んだままでも読めるようにする。

        #file-path は p ではなく span にする。summary が受け付けるのは語句
        （phrasing content）で、p は入れられない。中身を入れる先（app.js の el.path）
        は id のままなので、書き込む側は変わらない。

        hidden を外すのも、名前が入ったとき（app.js の render）である。ほかの2つと
        違って目録だけでは名前が入らないので、目録の時点で外すと、--locale を省いた
        起動では添え字だけの畳みが焦点の順に残る。

        残り（ゲームのフォルダー、断り書き、件数、数えたもの）は中に入れる。
        どれも起動したときの状態で、開いたときに読めれば足りる。中に見張り
        （aria-live / role="status"）は入れない。閉じた details は中身を支援技術の
        木から外すので、閉じているあいだ告知されない。
      -->
      <details id="panel-fold" class="fold" hidden>
        <summary>
          <svg class="icon" aria-hidden="true"><use href="#i-file-lines"/></svg>
          <span class="path-wrap">
            <span id="file-path" class="path"></span>
            <span id="panel-more" class="panel-more"></span>
          </span>
          <svg class="icon chev" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </summary>
        <div class="fold-body">
          <!--
            作業コピーを探しているゲームのフォルダー。探し先が無いときは空のまま隠れる。
            どのファイルを読んだかは上の #file-path に出るので、こちらは「どこを
            探したか」だけを言う欄である。
          -->
          <p id="game-path" class="path game" hidden></p>
          <ul id="notes" class="notes"></ul>
          <div class="panel-cols">
            <div>
              <h2>
                <svg class="icon" aria-hidden="true"><use href="#i-list-check"/></svg>
                <span id="counts-title"></span>
              </h2>
              <ul id="counts" class="counts"></ul>
            </div>
            <div>
              <h2>
                <svg class="icon" aria-hidden="true"><use href="#i-chart-simple"/></svg>
                <span id="stats-title"></span>
              </h2>
              <ul id="stats" class="stats"></ul>
            </div>
          </div>
        </div>
      </details>
      <!--
        書き出し。いま開いているロケールのCSVを、好きな場所へ保存させる。

        「ファイル」の畳みと同じ一帯に置く。どちらも「いま直しているのがどの
        ファイルか」の話で、離して置くと、上に出ている名前と、ここで書き出す
        中身が別物に見える。

        畳んでおく。押すのは作業が一区切りしたときだけで、開いたままだと
        条件の一帯が列の中でスクロールアウトする。ほかの畳みと同じく hidden で
        始め、文言が入ったら出す（app.js の applyCatalog）。空の summary は、
        名前を持たない焦点の止まり場になる。
      -->
      <details id="export-fold" class="fold" hidden>
        <summary id="export-title"></summary>
        <div class="fold-body">
          <p id="export-help" class="notice keys"></p>
          <div class="export-choice">
            <button id="export-published" class="btn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-file-import"/></svg>
              <span id="export-published-label"></span>
            </button>
            <p id="export-published-note" class="export-note"></p>
          </div>
          <div class="export-choice">
            <button id="export-working" class="btn" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-floppy-disk"/></svg>
              <span id="export-working-label"></span>
            </button>
            <p id="export-working-note" class="export-note"></p>
          </div>
        </div>
      </details>
      <!--
        書き出しの結果。畳みの外に置く。中に置くと、閉じているあいだ支援技術の
        木から外れて告知されない（counts_test.go の assertFoldsHoldNoLiveRegion）。
        押すのは畳みを開いているときだけなので、中でも読めはするが、告知する欄を
        畳める場所に置く作りそのものを残さない。

        #message と同じく hidden は出し入れせず、中身の入れ替えで出し入れする
        （空のときは app.css の .export-state:empty が余白を落とす）。
      -->
      <p id="export-state" class="export-state" role="status"></p>
    </section>
  </aside>
  <!-- 引き出しの後ろの幕。狭い画面で引き出しが開いているあいだだけ出す。押すと閉じる。 -->
  <div id="backdrop" class="backdrop" hidden></div>

  <main class="content">
    <p id="edit-notice" class="notice callout">
      <svg class="icon" aria-hidden="true"><use href="#i-circle-info"/></svg>
      <span id="edit-notice-text"></span>
    </p>
    <div class="card table">
      <!--
        列の見出し。行は表ではなく div の並び（1721行ぶんの table は重い）なので、
        見出しも div で置く。文言は目録から入れる。狭い画面では列が縦に並ぶので
        出さない（app.css）。
      -->
      <div class="thead">
        <span id="col-line"></span>
        <span id="col-status"></span>
        <span id="col-speaker"></span>
        <span id="col-source"></span>
        <span id="col-translation"></span>
      </div>
      <!--
        1行も出なかったときの文言。真っ白な一覧だけだと、壊れたのか条件に当たって
        いないのかが画面から読み取れない。文言は目録から入れる。

        #message と同じく hidden を出し入れしない。出し入れは中身の入れ替えで行い、
        空のときは app.css の .notice.empty:empty が余白を落とす。
      -->
      <p id="empty" class="notice empty" role="status"></p>
      <div id="list" class="list"></div>
    </div>
  </main>
</div>
</body>
</html>
