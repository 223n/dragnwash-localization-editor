<!DOCTYPE html>
<!--
  画面の骨組み。文言は1つも書かない。すべて app.js が目録（/api/bootstrap）から
  埋める。ここに日本語を書くと、目録を英語にしても残る文字列ができてしまう。

  lang と dir の初期値は、目録が届くまでの暫定。届いたら app.js が書き換える。

  題名（title）は "dwloc" のまま始める。題名はブラウザーの履歴に残るので、
  原文はもちろん、行の中身になりうる値を一切入れない。
-->
<html lang="en" dir="ltr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!--
  ブラウザー内蔵の翻訳を止める。CSP はこの頁が出す通信しか塞げないが、
  ブラウザー自身の翻訳はページの文字列を外部のサービスへ送る。原文を
  再配布しないことがこのプロジェクトの設計の中心なので、その経路を塞ぐ。
  html の translate="no" と class="notranslate" も同じ目的。
-->
<meta name="google" content="notranslate">
<title>dwloc</title>
<!--
  空の data: URL を favicon にしておく。これが無いと、ブラウザーが /favicon.ico を
  取りにきて毎回 404 になる。外部の画像は参照しない。
-->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<!--
  上に貼り付けておく一帯。保存の状態と、競合の引き止めと、失敗の理由を入れる。

  貼り付けるのは、1839行の途中で競合が起きても決断用のボタンが画面に残るように
  するためである。貼り付けないと、ボタンは画面の55,000px 上にあり、そのあいだ
  自動保存は止まったままになる（実際に起きた）。
-->
<div class="top">
  <header class="bar">
    <h1 id="app-title">dwloc</h1>
    <label class="field">
      <span id="locale-label"></span>
      <select id="locale"></select>
    </label>
    <button id="reload" type="button"></button>
    <span id="rows" class="rows"></span>
    <!--
      保存の状態。保存済み／保存しています／未保存 N 件／保存できません／競合。
      黙って成功したように見せないための欄で、文言は app.js が目録から入れる。
    -->
    <span id="save-state" class="save-state"></span>
  </header>

  <!--
    絞り込みと検索。貼り付ける一帯の中に置く。1839行のどこを見ていても条件を
    変えられるようにするためで、外に出すと画面の上まで戻らないと触れない。

    この一帯には div 要素を置かない。TestAlertsStayOnScreen が「.top の最初の
    閉じ div まで」を貼り付いている範囲と見ているので、途中に div を挟むと
    競合の引き止めが範囲の外に出たことになる。

    条件も検索語も、URL にも待ち受けへの要求にも載せない。行はもうブラウザーの
    中にあるので、待ち受けに聞く必要がない。聞けば、検索語（＝原文の断片）が
    待ち受けの記録に残りうる。
  -->
  <section class="finder">
    <span id="filter-label" class="finder-label"></span>
    <span id="filters" class="filters"></span>
    <button id="filter-clear" type="button"></button>
    <label class="field">
      <span id="search-label"></span>
      <!--
        検索の入力欄。綴り検査と自動補正と自動補完を切る。訳の入力欄と同じ理由で、
        ブラウザーの綴り検査は入力の中身を外部のサービスへ送りうる経路である。
        検索語は原文の断片なので、訳と同じ扱いにする。

        type は text にする。search にすると、ブラウザーによっては前に打った語を
        候補として出す。その候補はブラウザー側に残る。
      -->
      <input id="search" type="text" class="notranslate" translate="no"
        spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off">
    </label>
    <span id="shown" class="shown"></span>
  </section>

  <p id="message" class="notice error" hidden></p>

  <!--
    競合（409）の引き止め。手前でファイルが変わったとき、どちらの編集を載せるかを
    人に選ばせる。黙って上書きも、黙って破棄もしない。ボタンは2つとも type="button"
    で、form は使わない（CSP の form-action 'none' と、CSRF の入口を増やさないため）。
  -->
  <section id="conflict" class="conflict" hidden>
    <p id="conflict-title"></p>
    <p id="conflict-help"></p>
    <button id="conflict-keep" type="button"></button>
    <button id="conflict-take" type="button"></button>
  </section>

  <!--
    行き先が見つからなくなった訳。読み直した内容にその行が無いとき、訳を
    捨てずにここへ出す。画面から消さないのは、それが訳の残っている最後の
    場所になるためで、翻訳者が控えるまでは出し続ける。
  -->
  <section id="orphans" class="orphans" hidden>
    <p id="orphans-title"></p>
    <ul id="orphans-list" class="orphans-list"></ul>
  </section>
</div>

<p id="edit-notice" class="notice"></p>
<!--
  効くキーを画面から読めるようにする。覚えていないと使えない近道は、
  無いのと同じである。文言は目録から入れる。
-->
<p id="keys" class="notice keys"></p>
<!--
  絞り込みと検索の断り書き。貼り付く一帯の外に置く。読むのは1度で足りるのに、
  貼り付けると1839行のあいだずっと画面の1割を占める。
-->
<p id="finder-note" class="notice keys"></p>

<section class="panel">
  <p id="file-path" class="path"></p>
  <ul id="notes" class="notes"></ul>
  <div class="panel-cols">
    <div>
      <h2 id="counts-title"></h2>
      <ul id="counts" class="counts"></ul>
    </div>
    <div>
      <h2 id="stats-title"></h2>
      <ul id="stats" class="stats"></ul>
    </div>
  </div>
</section>

<main id="list" class="list"></main>
</body>
</html>
